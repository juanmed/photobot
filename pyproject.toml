[project]
name = "photobot"
version = "0.1.0"
description = "HW and SW for the photobot"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "asyncio>=4.0.0",
    "gpiozero>=2.0.1",
    "lgpio>=0.2.2.0",
    "mediapy>=1.2.6",
    "numpy>=2.4.2",
    "opencv-python>=4.13.0.92",
    "pytest>=9.0.2",
    "rpi-hardware-pwm>=0.3.1",
    "tensorflow-hub>=0.16.1",
    "tensorflow[and-cuda]>=2.21.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "torchaudio>=2.0.0",
    "ultralytics>=8.4.33",
    "open-gopro[gui]>=0.22.0",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu126", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
]
torchvision = [
    { index = "pytorch-cu126", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
]
torchaudio = [
    { index = "pytorch-cu126", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv]
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
]
